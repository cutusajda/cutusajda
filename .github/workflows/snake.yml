name: Generate Snake Contribution Graph

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"     # Runs once every day at midnight UTC
  workflow_dispatch:        # Allows manual run from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Create the output directory (fixes "Build dir does not exist")
      - name: Create dist directory
        run: mkdir -p dist

      # Generate the Snake (GIF + SVG)
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: cutusajda
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif

      # Deploy generated files to the "output" branch
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          allow_empty_commit: true
          commit_message: "Update snake contribution graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
